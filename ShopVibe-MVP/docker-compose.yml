services:
  postgres:
    image: postgres:16
    container_name: shopvibe-postgres
    environment:
      POSTGRES_DB: shopvibe
      POSTGRES_USER: shopvibe
      POSTGRES_PASSWORD: shopvibe_dev
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopvibe -d shopvibe"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    container_name: shopvibe-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["9094:9094"]
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  connect:
    image: quay.io/debezium/connect:2.7
    container_name: shopvibe-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      ENABLE_DEBEZIUM_SCRIPTING: "false"
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  mongo:
    image: mongo:7
    container_name: shopvibe-mongo
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4
    container_name: shopvibe-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Cria o topico ANTES de worker e conector. Sem isso o Debezium so cria o topico no
  # primeiro evento e o worker assina um topico inexistente (UNKNOWN_TOPIC_OR_PART).
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: shopvibe-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic shopvibe.public.orders --partitions 3 --replication-factor 1
    restart: "no"

  connector-init:
    image: curlimages/curl:8.10.1
    container_name: shopvibe-connector-init
    depends_on:
      connect:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./connect/register-connector.sh:/register-connector.sh:ro
    entrypoint: ["/bin/sh", "/register-connector.sh"]
    restart: "no"

  worker:
    build: .
    container_name: shopvibe-worker
    command: ["python", "-m", "app.worker"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: shopvibe.public.orders
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: shopvibe
      REDIS_URL: redis://redis:6379/0
      TZ: America/Sao_Paulo
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      connector-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: .
    container_name: shopvibe-api
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: shopvibe
      REDIS_URL: redis://redis:6379/0
      TZ: America/Sao_Paulo
    ports: ["8000:8000"]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    build: .
    container_name: shopvibe-simulator
    command: ["python", "-m", "app.simulator"]
    environment:
      DATABASE_URL: postgresql://shopvibe:shopvibe_dev@postgres:5432/shopvibe
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      connector-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  mongo_data:
  redis_data:
